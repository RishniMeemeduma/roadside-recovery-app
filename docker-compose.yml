services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: roadside_recovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn roadsideassist.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dng5!*lu&8mi5$nu+5=%w&x)mp$vudqt3p$j!8gh3o&g3lhiyo
      - DB_HOST=db
      - DB_NAME=roadside_recovery
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
