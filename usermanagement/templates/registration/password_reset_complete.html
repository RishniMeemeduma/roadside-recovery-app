{% extends 'base.html' %}

{% block title %}Password Changed - QuickAssist{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
    <div style="background:#fff; padding:40px; border-radius:12px; box-shadow:0 2px 16px rgba(0,0,0,0.1); width:100%; max-width:460px; text-align:center;">
        <h1 style="margin-bottom:12px; color:#1a1a2e;">Password updated</h1>
        <p style="color:#555; margin-bottom:24px; line-height:1.5;">
            Your password has been changed successfully. You can now sign in with your new credentials.
        </p>
        <a href="{% url 'login' %}" style="display:inline-block; padding:12px 24px; background:#4a90d9; color:#fff; border-radius:8px; text-decoration:none; font-weight:600;">
            Sign in
        </a>
    </div>
</div>
{% endblock %}
