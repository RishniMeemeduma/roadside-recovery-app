<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | QuickAssist</title>
    <link rel="stylesheet" href="{% static 'usermanagement/css/home.css' %}">
</head>
<body>
    <header class="main-header">
        <div class="container header-inner">
            <div class="brand">QUICK<span>ASSIST</span> <span class="sub-brand">Northwest</span></div>
            <div class="header-cta">
                <a href="{% url 'login' %}" class="btn ghost">Sign in</a>
                <a href="{% url 'register' %}" class="btn solid">Register</a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-card">
                <h2>Create your account</h2>
                <form method="POST" novalidate>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn solid">Register</button>
                </form>
                <p class="auth-bottom">Already have an account? <a href="{% url 'login' %}">Login</a></p>
            </div>
        </div>
    </main>
</body>
</html>
